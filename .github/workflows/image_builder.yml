name: Image Builder

on:
  schedule:
    - cron: '13 16 * * *'
  workflow_dispatch:

jobs:
  build-amd64:
    uses: ./.github/workflows/build_amd64_images.yml
    permissions:
      contents: read
      packages: write

  build-arm64:
    uses: ./.github/workflows/build_arm64_images.yml
    permissions:
      contents: read
      packages: write

  merge:
    needs: [build-amd64, build-arm64]
    uses: ./.github/workflows/merge_push_images.yml
    permissions:
      contents: read
      packages: write