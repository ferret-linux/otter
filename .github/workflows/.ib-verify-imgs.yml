name: .ib-verify

on:
  workflow_call:

jobs:
  load-matrix-amd64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for amd64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["amd64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  load-matrix-arm64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for arm64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["arm64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  verify-amd64:
    needs: load-matrix-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.load-matrix-amd64.outputs.matrix) }}

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify arch-specific signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64

      - name: Pull arch-specific image
        run: |
          podman pull ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64

      - name: Run arch-specific image
        run: |
          podman run --rm ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64 echo ok

      - name: Verify manifest signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}

      - name: Pull manifest image
        run: |
          podman pull ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}

      - name: Run manifest image
        run: |
          podman run --rm ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} echo ok

  verify-arm64:
    needs: load-matrix-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.load-matrix-arm64.outputs.matrix) }}

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify arch-specific signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64

      - name: Pull arch-specific image
        run: |
          podman pull ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64

      - name: Run arch-specific image
        run: |
          podman run --rm ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64 echo ok

      - name: Verify manifest signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}

      - name: Pull manifest image
        run: |
          podman pull ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}

      - name: Run manifest image
        run: |
          podman run --rm ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} echo ok