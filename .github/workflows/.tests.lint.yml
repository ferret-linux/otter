name: CI - Lint Test

on:
  push:
  pull_request:

jobs:
  golangci-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --verbose

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck \
            internal/inside-container/assets/otter-init \
            internal/inside-container/assets/otter-export \
            internal/inside-container/assets/otter-host-exec \
            images/scripts/setup-common.sh \
            images/scripts/pkg-validator.sh