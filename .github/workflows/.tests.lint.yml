name: ci-lint-test (internal)

on:
  push:
  pull_request:

jobs:
  golangci-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --verbose

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run shellcheck
        run: |
          shellcheck \
            internal/insidecontainer/assets/otter-init \
            internal/insidecontainer/assets/otter-export \
            internal/insidecontainer/assets/otter-host-exec \
            images/scripts/setup-common.sh \
            images/scripts/pkg-validator.sh