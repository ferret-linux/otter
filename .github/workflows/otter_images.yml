name: Build Otter Images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/library/ubuntu:latest
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/ubuntu:26.04
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: lts
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/debian:stable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/debian:testing
            containerfile: debian.Containerfile
            name: debian-otr
            tag: testing
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/debian:unstable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: unstable
            platforms: linux/amd64,linux/arm64

          - image: quay.io/fedora/fedora:44
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: quay.io/fedora/fedora:rawhide
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: rawhide
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/archlinux:latest
            containerfile: arch-family.Containerfile
            name: arch-otr
            tag: latest
            platforms: linux/amd64

          - image: docker.io/blackarchlinux/blackarch:latest
            containerfile: arch-family.Containerfile
            name: blackarch-otr
            tag: latest
            platforms: linux/amd64

          - image: docker.io/gentoo/stage3:latest
            containerfile: gentoo.Containerfile
            name: gentoo-otr
            tag: stage3
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/almalinux:latest
            containerfile: rhel-family.Containerfile
            name: alma-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: docker.io/rockylinux/rockylinux:10-ubi-init
            containerfile: rhel-family.Containerfile
            name: rocky-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: quay.io/centos/centos:stream10
            containerfile: rhel-family.Containerfile
            name: centos-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: container-registry.oracle.com/os/oraclelinux:10
            containerfile: rhel-family.Containerfile
            name: oracle-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: registry.access.redhat.com/ubi10/ubi-init:latest
            containerfile: rhel-family.Containerfile
            name: rhel-otr
            tag: stable
            platforms: linux/amd64,linux/arm64

          - image: registry.opensuse.org/opensuse/leap:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: leap
            platforms: linux/amd64,linux/arm64

          - image: registry.opensuse.org/opensuse/tumbleweed:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: tumbleweed
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/alpine:latest
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: latest
            platforms: linux/amd64,linux/arm64

          - image: docker.io/library/alpine:edge
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: edge
            platforms: linux/amd64,linux/arm64

          - image: docker.io/kalilinux/kali-rolling:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: rolling
            platforms: linux/amd64,linux/arm64

          - image: docker.io/kalilinux/kali-bleeding-edge:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: edge
            platforms: linux/amd64,linux/arm64

          - image: ghcr.io/void-linux/void-glibc-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: glibc
            platforms: linux/amd64,linux/arm64

          - image: ghcr.io/void-linux/void-musl-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: musl
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}
          build-args: |
            IMAGE=${{ matrix.image }}