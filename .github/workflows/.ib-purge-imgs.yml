name: ib-purge (internal)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  purge:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Purge all packages
        run: |
          jq -r '[.[].name] | unique[]' images/images.json | while read -r package; do
            echo "Deleting package: $package"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /orgs/ferret-linux/packages/container/${package} && \
              echo "Deleted: $package" || \
              echo "Failed to delete: $package"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark images as unavailable
        run: |
          jq '.images_available = false' images/images-properties.json > tmp.json && mv tmp.json images/images-properties.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/images-properties.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: mark images unavailable after purge [skip ci]"
          git push