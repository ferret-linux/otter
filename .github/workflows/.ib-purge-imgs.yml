name: .ib-purge

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Purge all packages
        run: |
          jq -r '[.[].name] | unique[]' images/images.json | while read -r package; do
            echo "Deleting package: $package"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /orgs/ferret-linux/packages/container/${package} && \
              echo "Deleted: $package" || \
              echo "Failed to delete: $package"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}