name: ib-verify (internal)

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR (podman)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Login to GHCR (skopeo)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve manifest digest
        id: resolve
        run: |
          set -euo pipefail
          ref="ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}"
          success=0
          for i in 1 2 3; do
            if digest=$(skopeo inspect --format '{{.Digest}}' "docker://$ref" 2>/dev/null); then
              success=1
              break
            fi
            echo "Attempt $i/3 failed to resolve $ref, retrying in 15s..."
            sleep 15
          done
          [ "$success" -eq 1 ] || exit 1
          echo "IMAGE_REF=ghcr.io/ferret-linux/${{ inputs.name }}@${digest}" >> "$GITHUB_ENV"

      - name: Verify manifest signature
        run: |
          success=0
          for i in 1 2 3; do
            cosign verify \
              --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "$IMAGE_REF" && success=1 && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Pull manifest image
        run: |
          success=0
          for i in 1 2 3; do
            podman pull "$IMAGE_REF" && success=1 && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Run manifest image
        run: podman run --rm "$IMAGE_REF" echo ok
