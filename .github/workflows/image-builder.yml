name: 1.Image Builder (IB)

on:
  schedule:
    - cron: '00 00 */1 * *'
    - cron: '05 03 */1 * 1'
    - cron: '10 06 */1 * 0'
    - cron: '15 09 */1 * 1'
    - cron: '20 12 */1 * 2'
    - cron: '25 15 */1 * 3'
    - cron: '30 18 */1 * 4'
    - cron: '35 21 */1 * 5'
  workflow_dispatch:

jobs:
  load-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter enabled images
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true)]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  image-pipeline:
    needs: load-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    uses: ./.github/workflows/.ib-image-pipeline.yml
    with:
      name: ${{ matrix.name }}
      tag: ${{ matrix.tag }}
      image: ${{ matrix.image }}
      containerfile: ${{ matrix.containerfile }}
      arches: ${{ toJson(matrix.arches) }}
      display_name: ${{ matrix.display_name }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit

  update-props:
    needs: [image-pipeline]
    if: always()
    uses: ./.github/workflows/.ib-update-props.yml
    permissions:
      contents: write
      packages: read
    secrets: inherit