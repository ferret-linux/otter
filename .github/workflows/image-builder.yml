name: Build Otter Images

on:
  schedule:
    - cron: '13 16 * * *'
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/library/ubuntu:latest
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: stable
          - image: docker.io/library/ubuntu:26.04
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: lts
          - image: docker.io/library/debian:stable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: stable
          - image: docker.io/library/debian:testing
            containerfile: debian.Containerfile
            name: debian-otr
            tag: testing
          - image: docker.io/library/debian:unstable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: unstable
          - image: quay.io/fedora/fedora:44
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: stable
          - image: quay.io/fedora/fedora:rawhide
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: rawhide
          - image: docker.io/library/archlinux:latest
            containerfile: arch-family.Containerfile
            name: arch-otr
            tag: latest
          - image: docker.io/blackarchlinux/blackarch:latest
            containerfile: arch-family.Containerfile
            name: blackarch-otr
            tag: latest
          - image: docker.io/gentoo/stage3:latest
            containerfile: gentoo.Containerfile
            name: gentoo-otr
            tag: stage3
          - image: docker.io/library/almalinux:latest
            containerfile: rhel-family.Containerfile
            name: alma-otr
            tag: stable
          - image: docker.io/rockylinux/rockylinux:10-ubi-init
            containerfile: rhel-family.Containerfile
            name: rocky-otr
            tag: stable
          - image: quay.io/centos/centos:stream10
            containerfile: rhel-family.Containerfile
            name: centos-otr
            tag: stable
          - image: container-registry.oracle.com/os/oraclelinux:10
            containerfile: rhel-family.Containerfile
            name: oracle-otr
            tag: stable
          - image: registry.access.redhat.com/ubi10/ubi-init:latest
            containerfile: rhel-family.Containerfile
            name: rhel-otr
            tag: stable
          - image: registry.opensuse.org/opensuse/leap:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: leap
          - image: registry.opensuse.org/opensuse/tumbleweed:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: tumbleweed
          - image: docker.io/library/alpine:latest
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: latest
          - image: docker.io/library/alpine:edge
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: edge
          - image: docker.io/kalilinux/kali-rolling:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: rolling
          - image: docker.io/kalilinux/kali-bleeding-edge:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: edge
          - image: ghcr.io/void-linux/void-glibc-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: glibc
          - image: ghcr.io/void-linux/void-musl-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.containerfile }}
          push: true
          tags: ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64
          build-args: |
            IMAGE=${{ matrix.image }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/library/ubuntu:latest
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: stable
          - image: docker.io/library/ubuntu:26.04
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: lts
          - image: docker.io/library/debian:stable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: stable
          - image: docker.io/library/debian:testing
            containerfile: debian.Containerfile
            name: debian-otr
            tag: testing
          - image: docker.io/library/debian:unstable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: unstable
          - image: quay.io/fedora/fedora:44
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: stable
          - image: quay.io/fedora/fedora:rawhide
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: rawhide
          # arch and blackarch excluded — no arm64 support
          - image: docker.io/gentoo/stage3:latest
            containerfile: gentoo.Containerfile
            name: gentoo-otr
            tag: stage3
          - image: docker.io/library/almalinux:latest
            containerfile: rhel-family.Containerfile
            name: alma-otr
            tag: stable
          - image: docker.io/rockylinux/rockylinux:10-ubi-init
            containerfile: rhel-family.Containerfile
            name: rocky-otr
            tag: stable
          - image: quay.io/centos/centos:stream10
            containerfile: rhel-family.Containerfile
            name: centos-otr
            tag: stable
          - image: container-registry.oracle.com/os/oraclelinux:10
            containerfile: rhel-family.Containerfile
            name: oracle-otr
            tag: stable
          - image: registry.access.redhat.com/ubi10/ubi-init:latest
            containerfile: rhel-family.Containerfile
            name: rhel-otr
            tag: stable
          - image: registry.opensuse.org/opensuse/leap:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: leap
          - image: registry.opensuse.org/opensuse/tumbleweed:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: tumbleweed
          - image: docker.io/library/alpine:latest
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: latest
          - image: docker.io/library/alpine:edge
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: edge
          - image: docker.io/kalilinux/kali-rolling:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: rolling
          - image: docker.io/kalilinux/kali-bleeding-edge:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: edge
          - image: ghcr.io/void-linux/void-glibc-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: glibc
          - image: ghcr.io/void-linux/void-musl-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.containerfile }}
          push: true
          tags: ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64
          build-args: |
            IMAGE=${{ matrix.image }}

  merge:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-otr
            tag: stable
          - name: ubuntu-otr
            tag: lts
          - name: debian-otr
            tag: stable
          - name: debian-otr
            tag: testing
          - name: debian-otr
            tag: unstable
          - name: fedora-otr
            tag: stable
          - name: fedora-otr
            tag: rawhide
          - name: arch-otr
            tag: latest
            amd64_only: true
          - name: blackarch-otr
            tag: latest
            amd64_only: true
          - name: gentoo-otr
            tag: stage3
          - name: alma-otr
            tag: stable
          - name: rocky-otr
            tag: stable
          - name: centos-otr
            tag: stable
          - name: oracle-otr
            tag: stable
          - name: rhel-otr
            tag: stable
          - name: opensuse-otr
            tag: leap
          - name: opensuse-otr
            tag: tumbleweed
          - name: alpine-otr
            tag: latest
          - name: alpine-otr
            tag: edge
          - name: kali-otr
            tag: rolling
          - name: kali-otr
            tag: edge
          - name: void-otr
            tag: glibc
          - name: void-otr
            tag: musl

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and Push Manifest
        run: |
          if [ "${{ matrix.amd64_only }}" = "true" ]; then
            docker buildx imagetools create \
              -t ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64
          else
            docker buildx imagetools create \
              -t ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64 \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64
          fi