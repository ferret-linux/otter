name: 1.Image Builder (IB)

on:
  schedule:
  # Sunday — 00:17, 06:17, 12:17, 18:17
  - cron: '17 00 * * 0'
  - cron: '17 06 * * 0'
  - cron: '17 12 * * 0'
  - cron: '17 18 * * 0'
  # Monday — 01:23, 07:23, 13:23, 19:23
  - cron: '23 01 * * 1'
  - cron: '23 07 * * 1'
  - cron: '23 13 * * 1'
  - cron: '23 19 * * 1'
  # Tuesday — 02:41, 08:41, 14:41, 20:41
  - cron: '41 02 * * 2'
  - cron: '41 08 * * 2'
  - cron: '41 14 * * 2'
  - cron: '41 20 * * 2'
  # Wednesday — 03:59, 09:59, 15:59, 21:59
  - cron: '59 03 * * 3'
  - cron: '59 09 * * 3'
  - cron: '59 15 * * 3'
  - cron: '59 21 * * 3'
  # Thursday — 04:07, 10:07, 16:07, 22:07
  - cron: '07 04 * * 4'
  - cron: '07 10 * * 4'
  - cron: '07 16 * * 4'
  - cron: '07 22 * * 4'
  # Friday — 05:29, 11:29, 17:29, 23:29
  - cron: '29 05 * * 5'
  - cron: '29 11 * * 5'
  - cron: '29 17 * * 5'
  - cron: '29 23 * * 5'
  # Saturday — 00:47, 06:47, 12:47, 18:47
  - cron: '47 00 * * 6'
  - cron: '47 06 * * 6'
  - cron: '47 12 * * 6'
  - cron: '47 18 * * 6'
  workflow_dispatch:

jobs:
  load-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter enabled images
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true)]' images/images.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  image-pipeline:
    needs: load-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    # Two overlapping runs for the same image+tag must not both compute N+1
    # before the props writer acquires its lock; serialize the whole pipeline.
    concurrency:
      group: otter-image-pipeline-${{ matrix.name }}-${{ matrix.tag }}
      cancel-in-progress: false
    uses: ./.github/workflows/.ib-image-pipeline.yml
    with:
      name: ${{ matrix.name }}
      tag: ${{ matrix.tag }}
      image: ${{ matrix.image }}
      containerfile: ${{ matrix.containerfile }}
      arches: ${{ toJson(matrix.arches) }}
      display_name: ${{ matrix.display_name }}
      family: ${{ matrix.family }}
      image_variant: ${{ matrix.image_variant }}
      is_reliable_fallback: ${{ matrix.is_reliable_fallback }}
      enabled: ${{ matrix.enabled }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit