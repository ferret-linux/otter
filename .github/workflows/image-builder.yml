name: 1.Image Builder (IB)

on:
  schedule:
  # Sunday — 00:00, 04:48, 09:36, 14:24, 19:12
  - cron: '00 00 * * 0'
  - cron: '48 04 * * 0'
  - cron: '36 09 * * 0'
  - cron: '24 14 * * 0'
  - cron: '12 19 * * 0'
  # Monday — 00:41, 05:29, 10:17, 15:05, 19:53
  - cron: '41 00 * * 1'
  - cron: '29 05 * * 1'
  - cron: '17 10 * * 1'
  - cron: '05 15 * * 1'
  - cron: '53 19 * * 1'
  # Tuesday — 01:22, 06:10, 10:58, 15:46, 20:34
  - cron: '22 01 * * 2'
  - cron: '10 06 * * 2'
  - cron: '58 10 * * 2'
  - cron: '46 15 * * 2'
  - cron: '34 20 * * 2'
  # Wednesday — 02:03, 06:51, 11:39, 16:27, 21:15
  - cron: '03 02 * * 3'
  - cron: '51 06 * * 3'
  - cron: '39 11 * * 3'
  - cron: '27 16 * * 3'
  - cron: '15 21 * * 3'
  # Thursday — 02:44, 07:32, 12:20, 17:08, 21:56
  - cron: '44 02 * * 4'
  - cron: '32 07 * * 4'
  - cron: '20 12 * * 4'
  - cron: '08 17 * * 4'
  - cron: '56 21 * * 4'
  # Friday — 03:25, 08:13, 13:01, 17:49, 22:37
  - cron: '25 03 * * 5'
  - cron: '13 08 * * 5'
  - cron: '01 13 * * 5'
  - cron: '49 17 * * 5'
  - cron: '37 22 * * 5'
  # Saturday — 04:06, 08:54, 13:42, 18:30, 23:18
  - cron: '06 04 * * 6'
  - cron: '54 08 * * 6'
  - cron: '42 13 * * 6'
  - cron: '30 18 * * 6'
  - cron: '18 23 * * 6'
  workflow_dispatch:

jobs:
  load-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter enabled images
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true)]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  image-pipeline:
    needs: load-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    uses: ./.github/workflows/.ib-image-pipeline.yml
    with:
      name: ${{ matrix.name }}
      tag: ${{ matrix.tag }}
      image: ${{ matrix.image }}
      containerfile: ${{ matrix.containerfile }}
      arches: ${{ toJson(matrix.arches) }}
      display_name: ${{ matrix.display_name }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit