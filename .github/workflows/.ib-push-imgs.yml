name: .ib-push

on:
  workflow_call:

jobs:
  load-matrix-amd64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Filter matrix for amd64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["amd64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  load-matrix-arm64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Filter matrix for arm64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["arm64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  push-amd64:
    needs: load-matrix-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-amd64.outputs.matrix) }}

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-amd64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp

      - name: Load Image
        run: |
          podman image load \
            -i /tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.tar

      - name: Push
        run: |
          podman push \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64

  push-arm64:
    needs: load-matrix-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-arm64.outputs.matrix) }}

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp

      - name: Load Image
        run: |
          podman image load \
            -i /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar

      - name: Push
        run: |
          podman push \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64