name: ib-image-arm64 (internal)

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      tag:
        required: true
        type: string
      image:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      arches:
        required: true
        type: string
      build_number:
        required: true
        type: string
    outputs:
      old_digest:
        description: Digest of the previous arm64 image, if any
        value: ${{ jobs.image-arm64.outputs.old_digest }}

jobs:
  image-arm64:
    if: contains(fromJson(inputs.arches), 'arm64')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      old_digest: ${{ steps.old-digest.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Capture Old Digest
        id: old-digest
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pull Base Image
        uses: ./.github/actions/retry
        with:
          command: podman pull ${{ inputs.image }}

      - name: Build
        uses: ./.github/actions/retry
        with:
          command: |
            podman build \
              --build-arg IMAGE=${{ inputs.image }} \
              --build-arg OTTER_BUILD_NUMBER=${{ inputs.build_number }} \
              --build-arg TAG=${{ inputs.tag }} \
              --file images/${{ inputs.containerfile }} \
              --tag ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64 \
              .
          delay-seconds: "30"
          before-retry: podman system prune -af

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          curl-retries: '8'

      - name: Login to GHCR (Cosign)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        uses: ./.github/actions/retry
        with:
          command: |
            podman push \
              --retry 3 \
              --compression-format=zstd:chunked \
              --compression-level=20 \
              ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64

      - name: Sign
        uses: ./.github/actions/retry
        with:
          command: cosign sign --yes ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64
          attempts: "5"
          delay-seconds: "45"

      - name: Verify arch-specific signature
        uses: ./.github/actions/retry
        with:
          command: |
            cosign verify \
              --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64

      - name: Run arch-specific image
        run: podman run --rm ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64 echo ok
