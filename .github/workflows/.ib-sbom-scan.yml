name: .ib-sbom-scan

on:
  workflow_call:

jobs:
  load-matrix-amd64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for amd64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["amd64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  load-matrix-arm64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for arm64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["arm64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  sbom-amd64:
    needs: load-matrix-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-amd64.outputs.matrix) }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-amd64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp

      - name: Verify Checksum
        run: |
          sha256sum -c /tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.tar.sha256

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate SBOM
        run: |
          syft \
            docker-archive:/tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.tar \
            --output spdx-json \
            --file /tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-amd64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.spdx.json
          retention-days: 1

  sbom-arm64:
    needs: load-matrix-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-arm64.outputs.matrix) }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp

      - name: Verify Checksum
        run: |
          sha256sum -c /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar.sha256

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate SBOM
        run: |
          syft \
            docker-archive:/tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar \
            --output spdx-json \
            --file /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.spdx.json
          retention-days: 1