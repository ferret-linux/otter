name: ib-update-props (internal)

on:
  workflow_call:

jobs:
  update-props:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Collect image sizes and build properties
        run: |
          built_at="${{ github.event.repository.updated_at }}"
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          output=$(jq -c '.images' images/images-properties.json)

          result="[]"

          while IFS= read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            official_image=$(echo "$entry" | jq -r '.official_image')
            fallback_vendor_image=$(echo "$entry" | jq -r '.fallback_vendor_image')
            architecture=$(echo "$entry" | jq -c '.architecture')
            enabled=$(echo "$entry" | jq -r '.enabled')

            sizes="{}"

            # Extract otr name and tag from official_image
            # e.g. ghcr.io/ferret-linux/ubuntu-otr:stable -> ubuntu-otr, stable
            otr_name=$(echo "$official_image" | sed 's|ghcr.io/ferret-linux/||' | cut -d: -f1)
            otr_tag=$(echo "$official_image" | cut -d: -f2)

            for arch in $(echo "$architecture" | jq -r '.[]'); do
              arch_image="ghcr.io/ferret-linux/${otr_name}:${otr_tag}-${arch}"

              podman pull "$arch_image" 2>/dev/null || continue

              compressed=$(podman image inspect "$arch_image" --format '{{.Size}}' 2>/dev/null || echo 0)
              virtual=$(podman image inspect "$arch_image" --format '{{.VirtualSize}}' 2>/dev/null || echo 0)

              sizes=$(echo "$sizes" | jq \
                --arg arch "$arch" \
                --argjson compressed "$compressed" \
                --argjson disk "$virtual" \
                '. + {($arch): {"compressed_size": $compressed, "disk_size": $disk}}')
            done

            entry_updated=$(jq -n \
              --arg name "$name" \
              --arg official_image "$official_image" \
              --arg fallback_vendor_image "$fallback_vendor_image" \
              --argjson architecture "$architecture" \
              --argjson enabled "$enabled" \
              --arg built_at "$built_at" \
              --argjson sizes "$sizes" \
              '{
                name: $name,
                official_image: $official_image,
                fallback_vendor_image: $fallback_vendor_image,
                architecture: $architecture,
                enabled: $enabled,
                built_at: $built_at,
                sizes: $sizes
              }')

            result=$(echo "$result" | jq --argjson e "$entry_updated" '. + [$e]')
          done < <(echo "$output" | jq -c '.[]')

          jq -n \
            --argjson images "$result" \
            '{"images_available": true, "images": $images}' > images/images-properties.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/images-properties.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update images-properties.json [skip ci]"
          git push