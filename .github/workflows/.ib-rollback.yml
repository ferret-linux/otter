name: ib-rollback (internal)

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      tag:
        required: true
        type: string
      image_amd64_old_digest:
        required: false
        type: string
        default: ""
      image_arm64_old_digest:
        required: false
        type: string
        default: ""
      merge_old_digest:
        required: false
        type: string
        default: ""

jobs:
  rollback:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Capture broken amd64 digest
        id: broken-amd64
        if: inputs.image_amd64_old_digest != ''
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-amd64 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Capture broken arm64 digest
        id: broken-arm64
        if: inputs.image_arm64_old_digest != ''
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Capture broken merged digest
        id: broken-merge
        if: inputs.merge_old_digest != ''
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }} 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Delete broken versions by digest
        if: inputs.image_amd64_old_digest != '' || inputs.image_arm64_old_digest != '' || inputs.merge_old_digest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROKEN_AMD64: ${{ steps.broken-amd64.outputs.digest }}
          BROKEN_ARM64: ${{ steps.broken-arm64.outputs.digest }}
          BROKEN_MERGE: ${{ steps.broken-merge.outputs.digest }}
          OLD_AMD64: ${{ inputs.image_amd64_old_digest }}
          OLD_ARM64: ${{ inputs.image_arm64_old_digest }}
          OLD_MERGE: ${{ inputs.merge_old_digest }}
        run: |
          delete_broken() {
            suffix=$1
            broken=$2
            old=$3
            [ -n "$broken" ] || return 0
            [ "$broken" != "$old" ] || return 0

            tagname="${{ inputs.tag }}${suffix}"
            version_id=$(gh api "/orgs/ferret-linux/packages/container/${{ inputs.name }}/versions" \
              --paginate | jq -r --arg digest "$broken" --arg tag "$tagname" \
              '(.[] | select(.name == $digest or .metadata.container.digest == $digest) | .id),
               (.[] | select(.metadata.container.tags[]? == $tag) | .id)' \
              | head -n1)
            if [ -n "$version_id" ]; then
              gh api --method DELETE \
                "/orgs/ferret-linux/packages/container/${{ inputs.name }}/versions/${version_id}" || true
            fi
          }

          delete_broken "-amd64" "$BROKEN_AMD64" "$OLD_AMD64"
          delete_broken "-arm64" "$BROKEN_ARM64" "$OLD_ARM64"
          delete_broken "" "$BROKEN_MERGE" "$OLD_MERGE"

      - name: Rollback amd64 tag
        if: inputs.image_amd64_old_digest != ''
        run: |
          podman pull ghcr.io/ferret-linux/${{ inputs.name }}@${{ inputs.image_amd64_old_digest }}
          podman tag ghcr.io/ferret-linux/${{ inputs.name }}@${{ inputs.image_amd64_old_digest }} ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-amd64
          podman push ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-amd64

      - name: Rollback arm64 tag
        if: inputs.image_arm64_old_digest != ''
        run: |
          podman pull ghcr.io/ferret-linux/${{ inputs.name }}@${{ inputs.image_arm64_old_digest }}
          podman tag ghcr.io/ferret-linux/${{ inputs.name }}@${{ inputs.image_arm64_old_digest }} ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64
          podman push ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}-arm64

      - name: Rollback merged manifest tag
        if: inputs.merge_old_digest != ''
        run: |
          podman pull ghcr.io/ferret-linux/${{ inputs.name }}@${{ inputs.merge_old_digest }}
          podman tag ghcr.io/ferret-linux/${{ inputs.name }}@${{ inputs.merge_old_digest }} ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}
          podman push ghcr.io/ferret-linux/${{ inputs.name }}:${{ inputs.tag }}
