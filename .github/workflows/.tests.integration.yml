name: CI - Integration Tests

on:
  schedule:
    - cron: "54 3 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: "${{ matrix.image }} | ${{ matrix.backend }} | ${{ matrix.mode }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [podman, docker, nerdctl]
        mode: [rootless, rootful]
        image: [ubuntu, fedora, arch, alpine, void-glibc, opensuse-leap, rocky, gentoo]
        exclude:
          # nerdctl rootless is not supported
          - backend: nerdctl
            mode: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build otter
        run: |
          go build -o /usr/local/bin/otter ./cmd/otter

      - name: Run integration test
        run: |
          chmod +x tests/runner/${{ matrix.image }}.sh
          tests/runner/${{ matrix.image }}.sh ${{ matrix.backend }} ${{ matrix.mode }}

  integration-ubuntu-extra:
    name: "ubuntu-extra | ${{ matrix.backend }} | ${{ matrix.mode }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [podman, docker, nerdctl]
        mode: [rootless, rootful]
        exclude:
          - backend: nerdctl
            mode: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build otter
        run: |
          go build -o /usr/local/bin/otter ./cmd/otter

      - name: Run integration test
        run: |
          chmod +x tests/runner/ubuntu-extra.sh
          tests/runner/ubuntu-extra.sh ${{ matrix.backend }} ${{ matrix.mode }}

