name: ib-image-pipeline (internal)

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      tag:
        required: true
        type: string
      image:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      arches:
        required: true
        type: string
      display_name:
        required: true
        type: string

jobs:
  image-amd64:
    uses: ./.github/workflows/.ib-image-amd64.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
      image: ${{ inputs.image }}
      containerfile: ${{ inputs.containerfile }}
      arches: ${{ inputs.arches }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  image-arm64:
    uses: ./.github/workflows/.ib-image-arm64.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
      image: ${{ inputs.image }}
      containerfile: ${{ inputs.containerfile }}
      arches: ${{ inputs.arches }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  merge:
    needs: [image-amd64, image-arm64]
    if: |
      always() &&
      (needs.image-amd64.result == 'success' || needs.image-amd64.result == 'skipped') &&
      (needs.image-arm64.result == 'success' || needs.image-arm64.result == 'skipped')
    uses: ./.github/workflows/.ib-merge.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
      arches: ${{ inputs.arches }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  verify-amd64:
    if: contains(fromJson(inputs.arches), 'amd64')
    needs: merge
    uses: ./.github/workflows/.ib-verify-amd64.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      packages: read
    secrets: inherit

  verify-arm64:
    if: contains(fromJson(inputs.arches), 'arm64')
    needs: merge
    uses: ./.github/workflows/.ib-verify-arm64.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      packages: read
    secrets: inherit

  rollback:
    needs: [image-amd64, image-arm64, merge, verify-amd64, verify-arm64]
    if: |
      always() &&
      needs.merge.result == 'success' &&
      (needs.verify-amd64.result == 'failure' || needs.verify-arm64.result == 'failure')
    uses: ./.github/workflows/.ib-rollback.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
      image_amd64_old_digest: ${{ needs.image-amd64.outputs.old_digest }}
      image_arm64_old_digest: ${{ needs.image-arm64.outputs.old_digest }}
      merge_old_digest: ${{ needs.merge.outputs.old_digest }}
    permissions:
      contents: write
      packages: write
    secrets: inherit

  update-props:
    needs: [merge, verify-amd64, verify-arm64]
    if: |
      always() &&
      needs.merge.result == 'success' &&
      (needs.verify-amd64.result == 'success' || needs.verify-amd64.result == 'skipped') &&
      (needs.verify-arm64.result == 'success' || needs.verify-arm64.result == 'skipped')
    uses: ./.github/workflows/.ib-update-props.yml
    with:
      name: ${{ inputs.name }}
      tag: ${{ inputs.tag }}
      image: ${{ inputs.image }}
      arches: ${{ inputs.arches }}
      display_name: ${{ inputs.display_name }}
    permissions:
      contents: write
      packages: read
    secrets: inherit