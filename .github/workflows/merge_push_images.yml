name: Merge and Push Images

on:
  workflow_call:

jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-otr
            tag: stable
          - name: ubuntu-otr
            tag: lts
          - name: debian-otr
            tag: stable
          - name: debian-otr
            tag: testing
          - name: debian-otr
            tag: unstable
          - name: fedora-otr
            tag: stable
          - name: fedora-otr
            tag: rawhide
          - name: arch-otr
            tag: latest
            amd64_only: true
          - name: blackarch-otr
            tag: latest
            amd64_only: true
          - name: gentoo-otr
            tag: stage3
          - name: alma-otr
            tag: stable
          - name: rocky-otr
            tag: stable
          - name: centos-otr
            tag: stable
          - name: oracle-otr
            tag: stable
          - name: rhel-otr
            tag: stable
          - name: opensuse-otr
            tag: leap
          - name: opensuse-otr
            tag: tumbleweed
          - name: alpine-otr
            tag: latest
          - name: alpine-otr
            tag: edge
          - name: kali-otr
            tag: rolling
          - name: kali-otr
            tag: edge
          - name: void-otr
            tag: glibc
          - name: void-otr
            tag: musl

    steps:
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Create and Push Manifest
        run: |
          if [ "${{ matrix.amd64_only }}" = "true" ]; then
            docker buildx imagetools create \
              -t ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64
          else
            docker buildx imagetools create \
              -t ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64 \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64
          fi