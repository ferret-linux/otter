name: 2.Attestation Verify

on:
  workflow_dispatch:

jobs:
  load-matrix-amd64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for amd64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["amd64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  load-matrix-arm64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for arm64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["arm64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  verify-attestation-amd64:
    needs: load-matrix-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-amd64.outputs.matrix) }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR (Cosign)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Verify attestation
        run: |
          for i in 1 2 3; do
            cosign verify-attestation \
              --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --type spdxjson \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64 && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done

  verify-attestation-arm64:
    needs: load-matrix-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-arm64.outputs.matrix) }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR (Cosign)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Verify attestation
        run: |
          for i in 1 2 3; do
            cosign verify-attestation \
              --certificate-identity-regexp="https://github.com/ferret-linux/otter/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --type spdxjson \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64 && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done