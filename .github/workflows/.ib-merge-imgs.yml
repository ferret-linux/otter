name: ib-merge

on:
  workflow_call:

jobs:
  load-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true)]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  merge:
    needs: load-matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR (Cosign)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifest
        run: |
          for i in 1 2 3; do
            ARCHES='${{ toJson(matrix.arches) }}'
            if echo "$ARCHES" | jq -e 'contains(["arm64"])' > /dev/null; then
              podman manifest create \
                ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
                ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64 \
                ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64
            else
              podman manifest create \
                ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
                ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-amd64
            fi
            podman manifest push \
              ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} \
              docker://ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            podman manifest rm ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }} 2>/dev/null || true
            sleep 15
          done

      - name: Sign
        run: |
          cosign sign --yes \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}