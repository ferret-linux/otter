name: ib-arm (internal)

on:
  workflow_call:

jobs:
  load-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for arm64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["arm64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-arm64:
    needs: load-matrix
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Base Image
        run: |
          for i in 1 2 3; do
            podman pull ${{ matrix.image }} && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done

      - name: Build
        run: |
          for i in 1 2 3; do
            podman build \
              --build-arg IMAGE=${{ matrix.image }} \
              --file images/${{ matrix.containerfile }} \
              --tag ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64 \
              . && break
            echo "Attempt $i/3 failed, pruning and retrying in 30s..."
            podman system prune -af
            sleep 30
          done

      - name: Save Image
        run: |
          podman image save \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64 \
            -o /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar

      - name: Checksum
        run: |
          sha256sum /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar \
            > /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: |
            /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar
            /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar.sha256
          retention-days: 1