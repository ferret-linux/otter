name: .ib-arm

on:
  workflow_call:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/library/ubuntu:latest
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: stable
          - image: docker.io/library/ubuntu:26.04
            containerfile: ubuntu.Containerfile
            name: ubuntu-otr
            tag: lts
          - image: docker.io/library/debian:stable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: stable
          - image: docker.io/library/debian:testing
            containerfile: debian.Containerfile
            name: debian-otr
            tag: testing
          - image: docker.io/library/debian:unstable
            containerfile: debian.Containerfile
            name: debian-otr
            tag: unstable
          - image: quay.io/fedora/fedora:44
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: stable
          - image: quay.io/fedora/fedora:rawhide
            containerfile: fedora.Containerfile
            name: fedora-otr
            tag: rawhide
          # arch and blackarch excluded — no arm64 support
          - image: docker.io/gentoo/stage3:latest
            containerfile: gentoo.Containerfile
            name: gentoo-otr
            tag: stage3
          - image: docker.io/library/almalinux:latest
            containerfile: rhel-family.Containerfile
            name: alma-otr
            tag: stable
          - image: docker.io/rockylinux/rockylinux:10-ubi-init
            containerfile: rhel-family.Containerfile
            name: rocky-otr
            tag: stable
          - image: quay.io/centos/centos:stream10
            containerfile: rhel-family.Containerfile
            name: centos-otr
            tag: stable
          - image: container-registry.oracle.com/os/oraclelinux:10
            containerfile: rhel-family.Containerfile
            name: oracle-otr
            tag: stable
          - image: registry.access.redhat.com/ubi10/ubi-init:latest
            containerfile: rhel-family.Containerfile
            name: rhel-otr
            tag: stable
          - image: registry.opensuse.org/opensuse/leap:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: leap
          - image: registry.opensuse.org/opensuse/tumbleweed:latest
            containerfile: opensuse.Containerfile
            name: opensuse-otr
            tag: tumbleweed
          - image: docker.io/library/alpine:latest
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: latest
          - image: docker.io/library/alpine:edge
            containerfile: alpine.Containerfile
            name: alpine-otr
            tag: edge
          - image: docker.io/kalilinux/kali-rolling:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: rolling
          - image: docker.io/kalilinux/kali-bleeding-edge:latest
            containerfile: kali.Containerfile
            name: kali-otr
            tag: edge
          - image: ghcr.io/void-linux/void-glibc-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: glibc
          - image: ghcr.io/void-linux/void-musl-full:latest
            containerfile: void.Containerfile
            name: void-otr
            tag: musl

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Base Image
        run: |
          for i in 1 2 3; do
            podman pull ${{ matrix.image }} && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done

      - name: Build
        run: |
          podman build \
            --build-arg IMAGE=${{ matrix.image }} \
            --file images/${{ matrix.containerfile }} \
            --tag ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64 \
            .

      - name: Save Image
        run: |
          podman image save \
            ghcr.io/ferret-linux/${{ matrix.name }}:${{ matrix.tag }}-arm64 \
            -o /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.tar
          retention-days: 1