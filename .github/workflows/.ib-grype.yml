name: .ib-grype

on:
  workflow_call:

jobs:
  load-matrix-amd64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for amd64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["amd64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  load-matrix-arm64:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter matrix for arm64
        id: filter
        run: |
          matrix=$(jq -c '[.[] | select(.enabled == true and (.arches | contains(["arm64"])))]' images/images.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  grype-amd64:
    needs: load-matrix-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-amd64.outputs.matrix) }}

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-amd64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7

      - name: Add Grype to PATH
        run: echo "$(dirname ${{ steps.grype.outputs.cmd }})" >> $GITHUB_PATH

      - name: Scan SBOM
        run: |
          grype \
            sbom:/tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.spdx.json \
            --output json \
            --file /tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.grype.json \
            ${{ matrix.grype_distro && format('--distro {0}', matrix.grype_distro) || '' }}

      - name: Upload Grype Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype-amd64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp/${{ matrix.name }}-${{ matrix.tag }}-amd64.grype.json
          retention-days: 1

  grype-arm64:
    needs: load-matrix-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix-arm64.outputs.matrix) }}

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7

      - name: Add Grype to PATH
        run: echo "$(dirname ${{ steps.grype.outputs.cmd }})" >> $GITHUB_PATH

      - name: Scan SBOM
        run: |
          grype \
            sbom:/tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.spdx.json \
            --output json \
            --file /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.grype.json \
            ${{ matrix.grype_distro && format('--distro {0}', matrix.grype_distro) || '' }}

      - name: Upload Grype Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype-arm64-${{ matrix.name }}-${{ matrix.tag }}
          path: /tmp/${{ matrix.name }}-${{ matrix.tag }}-arm64.grype.json
          retention-days: 1