{{define "row"}}
<tr id="row-{{.Name}}" class="row-selectable{{if .Selected}} row-selected{{end}}" data-name="{{.Name}}" hx-get="/containers/{{.Name}}/panel" hx-target="#detail-panel" hx-swap="innerHTML" onclick="otterSelectRow('{{.Name}}')">
  <td>{{.Name}}{{if .Locked}} <span title="locked">🔒</span>{{end}}</td>
  <td>
    {{if .Upgrading}}
      <span class="status status-upgrading">⟳ upgrading</span>
    {{else if .Starting}}
      <span class="status status-starting">◐ starting</span>
    {{else if .IsRunning}}
      <span class="status status-running">● running</span>
    {{else}}
      <span class="status status-stopped">○ {{.Status}}</span>
    {{end}}
  </td>
  <td>{{.Image}}</td>
</tr>
{{end}}
