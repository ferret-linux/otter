{{define "content"}}
<header class="topbar">
  <h1>Instances</h1>
  <input class="search-box" type="search" id="container-search" placeholder="Search" onkeyup="otterFilterRows()">
</header>
<div class="page-body">
  <main>
    {{template "container_list" .}}
  </main>
  <div id="detail-panel" class="detail-panel">
    <div class="detail-panel-empty">Select an instance to view details</div>
  </div>
</div>
<script>
  function otterFilterRows() {
    const q = document.getElementById('container-search').value.toLowerCase();
    document.querySelectorAll('#container-rows tr').forEach(function (row) {
      row.style.display = row.dataset.name.toLowerCase().includes(q) ? '' : 'none';
    });
  }
  function otterSelectRow(name) {
    // Tracks the open selection in a data attribute on #container-list
    // itself (not just a CSS class on the row), so the value survives the
    // htmx poll's outerHTML swap — see container_list's hx-vals below,
    // which reads this attribute to tell the server which row to
    // re-highlight on every 3s refresh instead of the highlight being lost
    // when the polled markup replaces every <tr>.
    const list = document.getElementById('container-list');
    if (list) {
      list.dataset.selected = name;
    }
    document.querySelectorAll('#container-rows tr').forEach(function (row) {
      row.classList.toggle('row-selected', row.dataset.name === name);
    });
  }
</script>
{{end}}

{{define "container_list"}}
<div
  id="container-list"
  class="container-list"
  data-selected="{{.Selected}}"
  hx-get="/containers"
  hx-trigger="every 3s"
  hx-target="this"
  hx-swap="outerHTML"
  hx-vals="js:{selected: document.getElementById('container-list') ? document.getElementById('container-list').dataset.selected : ''}"
>
{{if not .Rows}}
  <p class="empty">No containers found. Use <a href="/create">+ Create new</a> to make one.</p>
{{else}}
  <table class="containers">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Image</th>
      </tr>
    </thead>
    <tbody id="container-rows">
      {{range .Rows}}{{template "row" .}}{{end}}
    </tbody>
  </table>
{{end}}
</div>
{{end}}
