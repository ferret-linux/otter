{{define "content"}}
<div class="toolbar">
  <a class="btn" href="/registry">Registry</a>
  <a class="btn btn-primary" href="/containers/new">+ New container</a>
</div>
{{template "container_list" .}}
{{end}}

{{define "container_list"}}
<div id="container-list" hx-get="/containers" hx-trigger="every 3s" hx-target="this" hx-swap="outerHTML">
{{if not .}}
  <p class="empty">No containers found. Use <code>otter create</code> to make one.</p>
{{else}}
  <table class="containers">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Image</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="container-rows">
      {{range .}}{{template "row" .}}{{end}}
    </tbody>
  </table>
{{end}}
</div>
{{end}}
