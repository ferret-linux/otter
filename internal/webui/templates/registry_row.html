{{define "registry_row"}}
<tr id="registry-row-{{.Name}}">
  <td>{{.Name}}</td>
  <td>{{range $i, $a := .Architecture}}{{if $i}}, {{end}}{{$a}}{{end}}</td>
  <td>{{.BuiltAtRelative}}</td>
  <td>
    {{if .Pulling}}
      <span class="status status-upgrading">⟳ pulling</span>
    {{else}}
      <span class="status {{.LocalClass}}">{{.LocalDisplay}}</span>
    {{end}}
  </td>
  <td class="actions">
    {{if not .Pulling}}
      <button class="btn" hx-post="/registry/{{.Name}}/pull" hx-target="#registry-row-{{.Name}}" hx-swap="outerHTML">Pull</button>
      <button
        class="btn btn-danger"
        hx-post="/registry/{{.Name}}/remove"
        hx-target="#registry-row-{{.Name}}"
        hx-swap="outerHTML"
        hx-confirm="Remove local image for '{{.Name}}'? This cannot be undone."
      >Remove</button>
    {{end}}
    <a class="btn" href="/containers/new?image={{.ImageRef}}">Use this image</a>
  </td>
</tr>
{{end}}
