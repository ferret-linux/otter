{{define "registry_content"}}
<header class="topbar">
  <h1>Registry</h1>
  <input class="search-box" type="search" id="registry-search" placeholder="Search" onkeyup="otterFilterRegistryRows()">
</header>
<main>
  {{if not .Rows}}
    <p class="empty">No registry entries found.</p>
  {{else}}
    <table class="containers">
      <thead>
        <tr>
          <th>Name</th>
          <th>Arch</th>
          <th>Built</th>
          <th>Local</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="registry-rows">
        {{range .Rows}}{{template "registry_row" .}}{{end}}
      </tbody>
    </table>
  {{end}}
</main>
<script>
  function otterFilterRegistryRows() {
    const q = document.getElementById('registry-search').value.toLowerCase();
    document.querySelectorAll('#registry-rows tr').forEach(function (row) {
      row.style.display = row.dataset.name.toLowerCase().includes(q) ? '' : 'none';
    });
  }
</script>
{{end}}
