"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[ ](fg:color_bg3)\
$fill\
[](fg:color_blue)\
${env_var.container}\
[](bg:color_aqua fg:color_blue)\
$os\
${env_var.CONTAINER_ID}\
[](bg:color_red fg:color_aqua)\
${custom.otter_rootful}\
[](bg:color_purple fg:color_red)\
${custom.otter_initsystem}\
[](bg:color_aqua fg:color_purple)\
[](bg:color_bg1 fg:color_aqua)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'otter_prompt'

[palettes.otter_prompt]
color_fg0    = 'black'
color_fg0_1  = 'white'
color_bg1    = 'bright-black'
color_bg3    = 'bright-black'
color_blue   = 'bright-blue'
color_aqua   = 'bright-cyan'
color_green  = 'bright-green'
color_orange = 'yellow'
color_purple = 'bright-purple'
color_red    = 'bright-red'
color_yellow = 'bright-yellow'

[os]
disabled = false
style = "bg:color_aqua fg:color_fg0"

[os.symbols]
Kali             = '  '
Void             = '  '
Arch             = ' 󰣇 '
Artix            = '  '
NixOS            = '  '
Linux            = ' 󰌽 '
CentOS           = '  '
Debian           = ' 󰣚 '
Fedora           = ' 󰣛 '
Alpine           = '  '
Amazon           = '  '
Ubuntu           = ' 󰕈 '
Gentoo           = ' 󰣨 '
CachyOS          = ' 󰓓 '
openSUSE         = '  '
AlmaLinux        = '  '
RockyLinux       = '  '
OracleLinux      = ' 󰺡 '
RedHatEnterprise = ' 󱄛 '

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[bun]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:bright-cyan bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:bright-cyan bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0_1 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ 󱞪](bold fg:color_green)'
error_symbol = '[ 󱞪🗴](bold fg:color_red)'
vimcmd_symbol = '[ 󱞦](bold fg:color_green)'
vimcmd_replace_one_symbol = '[ 󱞦](bold fg:color_purple)'
vimcmd_replace_symbol = '[ 󱞦](bold fg:color_purple)'
vimcmd_visual_symbol = '[ 󱞦](bold fg:color_yellow)'

[env_var.container]
variable = "container"
style = "bg:color_blue fg:color_fg0"
format = '[ $env_value]($style)'

[env_var.CONTAINER_ID]
variable = "CONTAINER_ID"
style = "bg:color_aqua fg:color_fg0"
format = '[$env_value]($style)'

[fill]
symbol = " "

[custom.otter_rootful]
command = "true"
when = "test -f /usr/lib/otter/container.rootful"
style = "bg:color_red fg:color_fg0"
format = '[ 󰌾 rootful]($style)'

[custom.otter_initsystem]
command = "cat /usr/lib/otter/container.initsystem"
when = "test -f /usr/lib/otter/container.initsystem"
style = "bg:color_purple fg:color_fg0"
format = '[ 󰒓 $output]($style)'
