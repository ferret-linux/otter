# Format-1
# Each section is expressed as repeated section.key = value lines.
# Most explicit style — every key shows its full path.

container.hostname = ""
container.image    = "ghcr.io/ferret-linux/ubuntu-otr:lts"
container.name     = "my-container"

settings.shell       = ""
settings.init-system = false
settings.rootful     = false

preferences.container-manager = "autodetect"
preferences.sudo-program       = "sudo"
preferences.no-entry           = false

# Format-2
# Each section is a single inline table: section = { key = value, ... }.
# Best for compact, flat sections with only scalar values.

container    = { hostname = "", image = "ghcr.io/ferret-linux/ubuntu-otr:lts", name = "my-container" }
settings     = { shell = "", init-system = false, rootful = false }
preferences  = { container-manager = "autodetect", sudo-program = "sudo", no-entry = false }

# Format-3
# Each section gets its own [section] header.
# Most readable when you want clear separation between sections.

[container]
hostname = ""
image    = "ghcr.io/ferret-linux/ubuntu-otr:lts"
name     = "my-container"

[settings]
shell       = ""
init-system = false
rootful     = false

[preferences]
container-manager = "autodetect"
sudo-program      = "sudo"
no-entry          = false

# NOTE: All three formats produce identical parsed output. The parser does not distinguish between them.