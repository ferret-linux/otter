# Format-1
# Each section is expressed as repeated section.key = value lines.
# Most explicit style — every key shows its full path.

container.hostname = ""  # hostname inside the container
container.name     = ""  # default container name

images.default                     = ""  # ubuntu | ubuntu-lts | fedora | fedora-rawhide | arch | blackarch | gentoo | debian | debian-testing | debian-unstable | devuan | devuan-testing | devuan-unstable | alma | rocky | centos | oracle | rhel | opensuse-leap | opensuse-tumbleweed | alpine | alpine-edge | kali | kali-edge | void-glibc | void-musl | chimera | wolfi | or full registry path
images.staleness-warn-threshold     = 0  # build-count diff behind upstream at which otter warns, 0 disables
images.staleness-autopull-threshold = 0  # build-count diff behind upstream at which otter auto-pulls instead of warning, 0 disables

settings.shell           = ""     # bash | zsh | fish | nu
settings.init-system     = false  # true | false — enable systemd/init inside container by default
settings.rootful         = false  # true | false — run containers as root by default
settings.userns-nolimit  = false  # true | false — disable the rootless uid/gid range limit for user namespaces
settings.scripts-dir     = ""     # host directory where otter's provisioned scripts are stored, defaults to $HOME/.local/share/otter

preferences.container-manager = ""     # autodetect | podman | docker | nerdctl
preferences.sudo-program       = ""    # sudo program to use, e.g. sudo | doas
preferences.no-entry           = false # true | false — skip desktop entry generation by default

# Format-2
# Each section is a single inline table: section = { key = value, ... }.
# Best for compact, flat sections with only scalar values.

container   = { hostname = "", name = "" }
images      = { default = "", staleness-warn-threshold = 0, staleness-autopull-threshold = 0 }
settings    = { shell = "", init-system = false, rootful = false, userns-nolimit = false, scripts-dir = "" }
preferences = { container-manager = "", sudo-program = "", no-entry = false }

# Format-3
# Each section gets its own [section] header.
# Most readable when you want clear separation between sections.

[container]
hostname = ""
name     = ""

[images]
default                     = ""
staleness-warn-threshold     = 0
staleness-autopull-threshold = 0

[settings]
shell           = ""
init-system     = false
rootful         = false
userns-nolimit  = false
scripts-dir     = ""

[preferences]
container-manager = ""
sudo-program      = ""
no-entry          = false

# NOTE: All three formats produce identical parsed output. The parser does not distinguish between them.
