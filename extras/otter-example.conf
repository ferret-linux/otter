# Format-1

container.hostname = "my-dev-box"
container.image    = "fedora"
container.name     = "dev"

settings.shell           = "fish"
settings.init-system     = false
settings.rootful         = false
settings.userns-nolimit  = false
settings.scripts-dir     = "/home/user/.local/share/otter"

preferences.container-manager = "podman"
preferences.sudo-program       = "sudo"
preferences.no-entry           = false

# Format-2

container    = { hostname = "my-dev-box", image = "fedora", name = "dev" }
settings     = { shell = "fish", init-system = false, rootful = false, userns-nolimit = false, scripts-dir = "/home/user/.local/share/otter" }
preferences  = { container-manager = "podman", sudo-program = "sudo", no-entry = false }

# Format-3

[container]
hostname = "my-dev-box"
image    = "fedora"
name     = "dev"

[settings]
shell           = "fish"
init-system     = false
rootful         = false
userns-nolimit  = false
scripts-dir     = "/home/user/.local/share/otter"

[preferences]
container-manager = "podman"
sudo-program      = "sudo"
no-entry          = false

# NOTE: All three formats produce identical parsed output. The parser does not distinguish between them.