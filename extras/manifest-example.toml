ipc              = true
process          = false
devsys           = false
groups           = false
all              = false
userns-nolimit   = false

[[container]]
name  = "tumbleweed"
image = "registry.opensuse.org/opensuse/tumbleweed"

[[container]]
name    = "archbased"
include = "arch"

