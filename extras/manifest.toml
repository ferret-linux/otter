# Format-1
# Each group is expressed as repeated group.key = value lines.
# Clean and readable for groups with many fields or array values that benefit from individual alignment.
# Most explicit style — every key shows its full path. Good default choice for most manifests.

[[container]]
name       = ""     # name of the container
image      = ""     # ubuntu | ubuntu-lts | fedora | fedora-rawhide | arch | blackarch | debian | debian-testing | debian-unstable | alma | rocky | centos | oracle | rhel | opensuse-leap | opensuse-tumbleweed | alpine | alpine-edge | kali | kali-edge | void-glibc | void-musl | or full registry path
clone      = ""     # name of an existing stopped container to clone
start-now  = false  # true | false
force-pull = false  # true | false
include    = ""     # name of another container in this manifest to inherit from

additional.packages = []  # list of packages to install on creation
additional.volumes  = []  # list of volume mounts, format: /host/path:/container/path
additional.flags    = []  # list of extra flags passed directly to the container manager

exported.apps = []  # list of desktop app names to export to the host
exported.bins = []  # list of absolute binary paths to export to the host
exported.path = ""  # host path to export binaries to, defaults to ~/.local/bin

hooks.pre-init  = []  # commands to run before container initialization
hooks.post-init = []  # commands to run after container initialization

settings.lock        = false  # true | false — prevent upgrades and removal
settings.entry       = false  # true | false — generate a desktop entry on creation
settings.shell       = ""     # bash | zsh | fish | nu
settings.rootful     = false  # true | false — run container as root
settings.init-system = false  # true | false — enable systemd/init inside container
settings.hostname    = ""     # hostname inside the container

hardware.memory = ""     # max memory, e.g. 512m | 2g
hardware.gpu    = "mesa" # mesa | nvidia | nvidia-toolkit
hardware.cpu    = 0      # max number of cpu threads, 0 means unlimited

isolation.netns           = false  # true | false — isolate network namespace
isolation.ipc             = false  # true | false — isolate ipc namespace
isolation.process         = false  # true | false — isolate process namespace
isolation.devsys          = false  # true | false — isolate devices and sysfs
isolation.groups          = false  # true | false — do not forward host user groups
isolation.all             = false  # true | false — enable all isolation options above
isolation.userns-nolimit  = false  # true | false — disable the rootless uid/gid range limit for user namespaces

# Format-2
# Each group is a single line: group = { key = value, ... }.
# Best for compact, flat groups with only scalar values like settings, hardware, and isolation.
# Loses readability fast when arrays or many fields are involved, so avoid it for hooks or additional.

[[container]]
name       = ""
image      = ""
clone      = ""
start-now  = false
force-pull = false
include    = ""

additional = { packages = [], volumes = [], flags = [] }
exported   = { apps = [], bins = [], path = "" }
hooks      = { pre-init = [], post-init = [] }
settings   = { lock = false, entry = false, shell = "", rootful = false, init-system = false, hostname = "" }
hardware   = { memory = "", gpu = "mesa", cpu = 0 }
isolation  = { netns = false, ipc = false, process = false, devsys = false, groups = false, all = false, userns-nolimit = false }

# Format-3
# Each group gets its own [container.group] header, turning it into a proper named section.
# Most readable for large groups with many fields, especially hooks where multiline arrays need breathing room.
# The only format with an ordering constraint — all [container.group] blocks must appear before the next [[container]] header.

[[container]]
name       = ""
image      = ""
clone      = ""
start-now  = false
force-pull = false
include    = ""

[container.additional]
packages = []
volumes  = []
flags    = []

[container.exported]
apps = []
bins = []
path = ""

[container.hooks]
pre-init  = []
post-init = []

[container.settings]
lock        = false
entry       = false
shell       = ""
rootful     = false
init-system = false
hostname    = ""

[container.hardware]
memory = ""
gpu    = "mesa"
cpu    = 0

[container.isolation]
netns            = false
ipc              = false
process          = false
devsys           = false
groups           = false
all              = false
userns-nolimit   = false

# Format-4
# Combines the best of the other three:
# dotted keys for groups with arrays and alignment needs, block subtables for hooks, inline tables for flat scalar groups.
# No single rule — pick per-group based on what reads best. Recommended style for complex manifests.

[[container]]
name       = ""
image      = ""
clone      = ""
start-now  = false
force-pull = false
include    = ""

additional.packages = []
additional.volumes  = []
additional.flags    = []

exported.apps = []
exported.bins = []
exported.path = ""

[container.hooks]
pre-init  = []
post-init = []

settings  = { lock = false, entry = false, shell = "", rootful = false, init-system = false, hostname = "" }
hardware  = { memory = "", gpu = "mesa", cpu = 0 }
isolation = { netns = false, ipc = false, process = false, devsys = false, groups = false, all = false, userns-nolimit = false }

# NOTE : All four formats produce identical parsed output. The parser does not distinguish between them.